AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudShield DR - creates (1) a private, versioned, encrypted backup bucket with a
  cost-saving lifecycle rule and (2) a least-privilege IAM role that CloudShield can
  assume (only with your External ID). CloudShield can never delete or overwrite your
  data: delete permissions are explicitly denied and it may only write to the backup
  bucket and to the "cloudshield-restore/" folder of your source buckets.

Parameters:
  CloudShieldAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: AWS account ID of the CloudShield DR application (shown on the connection page).

  ExternalId:
    Type: String
    NoEcho: true
    AllowedPattern: "^[A-Za-z0-9_-]{16,128}$"
    Description: External ID generated by CloudShield DR for this connection (protects against the confused-deputy problem).

  BackupBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Globally-unique name for the NEW backup bucket created by this stack.

  SourceBucketScope:
    Type: String
    AllowedPattern: "^[a-z0-9.*?-]{1,255}$"
    Description: >
      Which of your buckets CloudShield may READ and protect. One bucket name (my-data),
      a pattern (prod-*), or * for all buckets. Use the narrowest scope that works.

  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: How long old (overwritten/deleted) versions are kept. This is also how far back you can recover. Longer = more storage cost.

  RoleName:
    Type: String
    Default: CloudShieldDRBackupRole
    AllowedPattern: "^[\\w+=,.@-]{1,64}$"
    Description: Name of the IAM role to create (must match the role ARN registered in CloudShield).

  SourceKmsKeyArn:
    Type: String
    Default: ""
    Description: Optional. ARN of the KMS key if your source buckets use SSE-KMS (lets CloudShield decrypt when copying).

  ObjectLockDays:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 365
    Description: >
      Optional ransomware hardening. 0 = off. If > 0, every backup version is locked
      (Governance mode) for this many days and cannot be deleted even by an attacker with
      stolen credentials. Keep it lower than RetentionDays.

Conditions:
  HasKmsKey: !Not [!Equals [!Ref SourceKmsKeyArn, ""]]
  UseObjectLock: !Not [!Equals [!Ref ObjectLockDays, 0]]

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # deleting this stack must never delete your backups
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BackupBucketName
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: !If [UseObjectLock, true, !Ref "AWS::NoValue"]
      ObjectLockConfiguration: !If
        - UseObjectLock
        - ObjectLockEnabled: Enabled
          Rule:
            DefaultRetention:
              Mode: GOVERNANCE
              Days: !Ref ObjectLockDays
        - !Ref "AWS::NoValue"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256   # SSE-S3: free, no KMS request charges
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersionsAndCleanUp
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref RetentionDays
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  CloudShieldDRBackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CloudShieldAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: CloudShieldBackupBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt BackupBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectTagging
                  - s3:GetObjectVersionTagging
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub "${BackupBucket.Arn}/*"

        - PolicyName: CloudShieldSourceReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${SourceBucketScope}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectTagging
                  - s3:GetObjectVersionTagging
                Resource: !Sub "arn:aws:s3:::${SourceBucketScope}/*"

        # Recovered data is written ONLY under cloudshield-restore/, never over your originals.
        - PolicyName: CloudShieldRestoreWriteOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:AbortMultipartUpload
                Resource: !Sub "arn:aws:s3:::${SourceBucketScope}/cloudshield-restore/*"

        - !If
          - HasKmsKey
          - PolicyName: CloudShieldSourceKmsDecrypt
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource: !Ref SourceKmsKeyArn
          - !Ref "AWS::NoValue"

        # Belt and braces: even if CloudShield (or its credentials) were compromised,
        # this role cannot destroy or weaken your backups.
        - PolicyName: CloudShieldDenyDestructiveActions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:DeleteObjectTagging
                  - s3:DeleteBucket
                  - s3:PutBucketVersioning
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketObjectLockConfiguration
                  - s3:PutObjectRetention
                  - s3:BypassGovernanceRetention
                Resource: "*"

Outputs:
  RoleArn:
    Description: Role ARN registered in CloudShield.
    Value: !GetAtt CloudShieldDRBackupRole.Arn
  BackupBucket:
    Description: Name of the backup bucket.
    Value: !Ref BackupBucket
